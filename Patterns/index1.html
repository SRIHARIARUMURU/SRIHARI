<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Date Validation</title>
</head>
<body>
  <br><br><br><br><br>
  <center>
    <table style="border-radius: 3cap; background-color: rgb(118, 41, 111);" border="0" cellspacing="100" cellpadding="10" >
      <tr>
        <th>
          <center>
            <form action="Successful.html">
              <label style="color: azure; font-size: larger;">Enter Date :&nbsp;&nbsp;&nbsp;&nbsp; </label>  
                <input type="text" autofocus placeholder="DD-MM-YYYY" pattern="[0-9]{2}-[0-9]{2}-[0-9]{4}" required><br><br>
              <input type="submit">
            </form>
          </center>
        </th>
      </tr>
    </table>
  </center>
</body>
</html>
