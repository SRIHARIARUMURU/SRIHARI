<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Types</title>
</head>
<body>
    <table border="" cellpadding="100px" cellspacing="0px" align="center">
        <tr>
            <td>
        <form>
            <label>Email :</label>
                <input type="email" placeholder="Email/Username" required><br><br>
            <label>Password :</label>
                <input type="password" placeholder="Passsword" required><br><br>
            <label>Enter Mobile Number :</label>
                <input type="tel" placeholder="+91 98765 43210" required><br><br>

            <label>Button : </label>
                <input value="Button" type="button"><br><br>
            <label>Radio :</label>
                <input type="radio"><br><br>
             <label>CheckBox :</label>
                <input value="checkbox"  type="checkbox"><br><br>
             <label>Search :</label>
                <input type="search" placeholder="Search"><br><br>
            <label>Enter Your Link :</label>
                <input type="url" placeholder="Enter Url"><br><br>
            <label>Color : </label>
                <input type="color"><br><br>
            <label>Week</label>
                <input type="week"><br><br>
            <label>Month</label>
                <input type="month"><br><br>
            <label>DOB :</label>
                <input type="date"><br><br>
            <label>Time :</label>
                <input type="time"><br><br>
            <label>D & T :</label>
                <input type="datetime"><br><br>
            <label>Date and Time :</label>
                <input type="datetime-local"><br><br>
            <label>Hidden :</label>
                <input type="hidden"><br><br>
            <label>Upload Your File Here :</label>
                <input type="file"><br><br>
            <label>Chose Your Image :</label>
                <input type="image"><br><br>
            <label>Number :</label>
                <input type="number"><br><br> 
            <label>Range</label>
                <input type="range"><br><br>
            <label>Text :</label>
                <input type="text"><br><br>
            <input type="submit"><br><br>
            <input type="reset"><br><br>
        </form>
         </td>
        </tr>
    </table>
   
</body>
</html>
